<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindMyID GPS V3</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
      background: #111;
      color: white;
    }

    .box {
      max-width: 420px;
      margin: auto;
      padding: 25px;
      border: 1px solid #555;
      border-radius: 16px;
    }

    button {
      font-size: 18px;
      padding: 14px 20px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      line-height: 1.7;
    }

    #deviceData {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 12px;
      text-align: left;
      line-height: 1.8;
    }

    .online {
      color: #4cff88;
    }

    .error {
      color: #ff7070;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>FindMyID</h1>
  <hr>
  <h2>ROHAN'S ID</h2>

  <p id="status">Connecting to FindMyID...</p>

  <div id="deviceData">
    Loading device data...
  </div>

  <button onclick="refreshDevice()">
    🔄 REFRESH LOCATION
  </button>

  <br>

  <button onclick="openMap()">
    🗺️ OPEN MAP
  </button>

</div>

<script>

const SUPABASE_URL = "https://zsvgszustevxolgbtvpy.supabase.co";
const SUPABASE_KEY = "sb_publishable_sSroAOT_nHFm9glDD3Zc4w_elGaE8bG";

let latitude = null;
let longitude = null;

async function refreshDevice() {

  const status = document.getElementById("status");
  const deviceData = document.getElementById("deviceData");

  status.innerHTML = "🔄 Getting latest device location...";
  status.className = "";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/findmyid_devices?device_name=eq.ROHAN_ID&order=last_seen.desc&limit=1",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Supabase HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.length) {
      latitude = null;
      longitude = null;
      status.innerHTML = "⚠️ No device data found.";
      status.className = "error";
      deviceData.innerHTML = "No ROHAN_ID record is available yet.";
      return;
    }

    const device = data[0];

    latitude = Number(device.latitude);
    longitude = Number(device.longitude);

    const accuracy = device.accuracy ?? "Unknown";
    const rssi = device.rssi ?? "Unknown";
    const lastSeen = device.last_seen
      ? new Date(device.last_seen).toLocaleString()
      : "Unknown";
    const deviceStatus = device.status || "unknown";

    status.innerHTML =
      "📍 Latest location found<br>" +
      "Status: " + deviceStatus;
    status.className = deviceStatus === "online" ? "online" : "";

    deviceData.innerHTML =
      "<strong>Device:</strong> " + device.device_name + "<br>" +
      "<strong>Latitude:</strong> " + latitude + "<br>" +
      "<strong>Longitude:</strong> " + longitude + "<br>" +
      "<strong>Accuracy:</strong> " + accuracy + " meters<br>" +
      "<strong>RSSI:</strong> " + rssi + " dBm<br>" +
      "<strong>Last Seen:</strong> " + lastSeen;

  } catch (error) {

    console.error(error);
    status.innerHTML = "❌ Could not load device location.";
    status.className = "error";
    deviceData.innerHTML =
      "Error: " + error.message;
  }
}

function openMap() {

  if (
    latitude === null ||
    longitude === null ||
    Number.isNaN(latitude) ||
    Number.isNaN(longitude)
  ) {
    alert("First load the latest device location.");
    return;
  }

  const url =
    "https://www.openstreetmap.org/" +
    "?mlat=" + latitude +
    "&mlon=" + longitude +
    "#map=18/" + latitude + "/" + longitude;

  window.open(url, "_blank");
}

refreshDevice();

setInterval(refreshDevice, 30000);

</script>

</body>
</html>
